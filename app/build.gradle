plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    signingConfigs {
        debug {
            storeFile file("D:\\My Libraries\\Google Drive\\Dropbox\\AudioBook.jks")
            storePassword 'Padd1ngt0n'
            keyAlias = 'audiobookkey'
            keyPassword 'Padd1ngt0n'
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId "com.kjjejones42.audiobookplayer"
        minSdkVersion 33
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.kjjejones42.audiobookplayer'
    kotlinOptions {
        jvmTarget = '1.8'
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

}

dependencies {
    ksp "androidx.room:room-compiler:2.7.1"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.room:room-runtime:2.7.1"
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.0'
    implementation "androidx.media:media:1.7.0"
    implementation 'androidx.palette:palette-ktx:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
